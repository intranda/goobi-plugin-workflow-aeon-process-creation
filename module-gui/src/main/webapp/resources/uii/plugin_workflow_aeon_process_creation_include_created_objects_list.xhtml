<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:section="http://goobi.io/section"
    xmlns:form="http://goobi.io/form"
    xmlns:util="http://goobi.io/util"
    xmlns:dl="http://goobi.io/dl">

    <composite:interface>
    </composite:interface>

    <composite:implementation>

        <!-- All Objects List (REQUEST SUCCESS) -->
        <div>
            <h:form id="itemSummaryForm" styleClass="d-flex flex-column gap-3">

                <!-- TITLE OF THE BATCH PROCESS ALL ACCEPTED RECORDS ARE COMBINED INTO -->
                <ui:fragment rendered="#{NavigationForm.workflowPlugin.creationMode == 'single'}">
                    <section:section type="outline">
                        <section:header
                            icon="file"
                            title="#{msgs.prozessTitel}" />
                        <section:body padding="true">
                            <h:outputText value="#{NavigationForm.workflowPlugin.batchProcessTitle}" />
                        </section:body>
                    </section:section>
                </ui:fragment>
                <!-- // TITLE OF THE BATCH PROCESS -->

                <ui:repeat
                    var="item"
                    value="#{NavigationForm.workflowPlugin.recordList}">

                    <!-- RUN THROUGH ALL ACCEPTED PROCESSES -->
                    <ui:fragment rendered="#{item.accepted}">
                        <section:section type="outline">
                            <section:header
                                icon="search"
                                title="#{item.displayTitle}">
                                <section:header-actions>
                                    <button
                                        type="button"
                                        class="btn d-flex align-items-center btn--title-action-neutral"
                                        title="#{(item.showDetails) ? 'hide details' : 'show details'}"
                                        jsf:id="details">
                                        <util:icon icon="#{(item.showDetails) ? 'chevron-up' : 'chevron-down'}" styleClass="#{item.accepted?'accepted':'notaccepted'}" />
                                        <f:setPropertyActionListener
                                            target="#{item.showDetails}"
                                            value="#{!item.showDetails}" />
                                        <f:ajax render="itemSummaryForm" />
                                    </button>
                                </section:header-actions>
                            </section:header>
                            <section:body>
                                <dl:list>
                                    <!-- future process title. Only when a process is created for each record: a batch carries one title for all
                                         of them, shown above the list, and the titles of the child processes it is later split into are decided
                                         by the split processes plugin, not here. -->
                                    <ui:fragment rendered="#{NavigationForm.workflowPlugin.creationMode != 'single'}">
                                        <dl:term>
                                            <h:outputText value="#{msgs.prozessTitel}" />
                                        </dl:term>
                                        <dl:description>
                                            <h:outputText value="#{NavigationForm.workflowPlugin.processTitleFor(item)}" />
                                        </dl:description>
                                    </ui:fragment>
                                    <ui:repeat
                                        value="#{item.properties}"
                                        var="property">
                                        <ui:fragment rendered="#{property.type == 'multiselect' and (item.showDetails or property.displayAlways)}">
                                            <ui:repeat
                                                var="val"
                                                value="#{property.multiselectSelectedValues}">
                                                <h:panelGroup rendered="#{item.showDetails or property.displayAlways}">
                                                    <dl:term>#{property.title}</dl:term>
                                                    <dl:description>#{val}</dl:description>
                                                </h:panelGroup>

                                            </ui:repeat>
                                        </ui:fragment>
                                        <h:panelGroup rendered="#{property.type != 'multiselect' and (item.showDetails or property.displayAlways)}">
                                            <dl:term>#{property.title}</dl:term>
                                            <dl:description>#{property.value}</dl:description>
                                        </h:panelGroup>

                                    </ui:repeat>

                                    <ui:repeat
                                        value="#{item.processProperties}"
                                        var="property">
                                        <ui:fragment rendered="#{property.type == 'multiselect' and (item.showDetails or property.displayAlways)}">
                                            <ui:repeat
                                                var="val"
                                                value="#{property.multiselectSelectedValues}">
                                                <h:panelGroup rendered="#{item.showDetails or property.displayAlways}">
                                                    <dl:term>#{property.title}</dl:term>
                                                    <dl:description>#{val}</dl:description>
                                                </h:panelGroup>
                                            </ui:repeat>
                                        </ui:fragment>
                                        <h:panelGroup rendered="#{property.type != 'multiselect' and (item.showDetails or property.displayAlways)}">
                                            <dl:term>#{property.title}</dl:term>
                                            <dl:description>#{property.value}</dl:description>
                                        </h:panelGroup>
                                    </ui:repeat>
                                </dl:list>

                            </section:body>
                        </section:section>
                    </ui:fragment>
                </ui:repeat>
                <!-- // RUN THROUGH ALL ACCEPTED PROCESSES -->

            </h:form>
        </div>
    </composite:implementation>
</ui:composition>
