<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:section="http://goobi.io/section"
    xmlns:form="http://goobi.io/form">

    <composite:interface>
    </composite:interface>

    <composite:implementation>

        <!-- BOX WITH TRANSACTION DETAILS -->
        <h:form id="myform" rendered="#{NavigationForm.workflowPlugin.requestSuccess and NavigationForm.workflowPlugin.operationType == 'creation'}" styleClass="mb-3">
            <section:section type="outline">
                <section:header
                    title="#{msgs.plugin_workflow_aeon_requestedDetails}"
                    icon="plug" />
                <section:body>
                    <ui:repeat
                        value="#{NavigationForm.workflowPlugin.transactionFields}"
                        var="property">
                        <ui:fragment rendered="#{property.type == 'select+text' || property.type == 'checkbox' || property.type == 'radio' || property.type == 'radio-dont-overwrite'}">
                            <form:field
                                label="#{property.title}"
                                group="true">
                                <!-- IF CHECKBOX FIELD -->
                                <ui:fragment rendered="#{property.type == 'checkbox'}">
                                <ui:include  src="plugin_workflow_aeon_include_checkbox.xhtml"/>
                                </ui:fragment>
                                <!-- // IF CHECKBOX FIELD -->

                                <!-- IF RADIO FIELD -->
                                <ui:fragment rendered="#{property.type == 'radio' or property.type == 'radio-dont-overwrite'}">
                                <ui:include  src="plugin_workflow_aeon_include_radio.xhtml"/>
                                </ui:fragment>
                                <!-- // IF RADIO FIELD -->

                                <!-- IF SELECT MENU WITH ADDITIONAL INPUT FIELD -->
                                <ui:fragment rendered="#{property.type == 'select+text'}">
                                    <ui:include  src="plugin_workflow_aeon_include_selectAndText.xhtml"/>
                                </ui:fragment>
                                <!-- // IF SELECT MENU WITH ADDITIONAL INPUT FIELD -->
                                <!-- VALIDATION AND HELP -->
                                <ui:include  src="plugin_workflow_aeon_include_validationAndHelp.xhtml"/>
                            </form:field>
                        </ui:fragment>
                        <ui:fragment rendered="#{property.type != 'select+text' and property.type != 'checkbox' and property.type != 'radio' and property.type != 'radio-dont-overwrite'}">
                            <form:field label="#{property.title}">
                                <!-- IF INPUT FIELD -->
                                <ui:fragment rendered="#{property.type == 'input' or property.type == 'input-dont-overwrite'}">
                                    <ui:include  src="plugin_workflow_aeon_include_input.xhtml"/>
                                </ui:fragment>
                                <!-- // IF INPUT FIELD -->

                                <!-- IF SELECT FIELD -->
                                <ui:fragment rendered="#{property.type == 'select' or property.type == 'vocabulary' or property.type == 'select-dont-overwrite'}">
                                    <ui:include  src="plugin_workflow_aeon_include_select.xhtml"/>
                                </ui:fragment>
                                <!-- // IF SELECT FIELD -->

                                <!-- IF MULTISELECT FIELD -->
                                <ui:fragment rendered="#{property.type == 'multiselect'}">
                                    <ui:include src="plugin_workflow_aeon_include_multiselect.xhtml"/>
                                </ui:fragment>
                                <!-- // IF MULTISELECT FIELD -->

                                <!-- VALIDATION AND HELP -->
                                <ui:include  src="plugin_workflow_aeon_include_validationAndHelp.xhtml"/>
                            </form:field>
                        </ui:fragment>
                    </ui:repeat>
                </section:body>
            </section:section>
        </h:form>
        <!-- // BOX WITH TRANSACTION DETAILS -->

    </composite:implementation>
</ui:composition>
