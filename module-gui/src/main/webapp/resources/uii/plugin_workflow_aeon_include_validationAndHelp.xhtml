<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:util="http://goobi.io/util">

    <composite:interface>
    </composite:interface>

    <composite:implementation>

        <!-- VALIDATION MESSAGE -->
        <h:panelGroup
            layout="block"
            rendered="#{!property.valid}"
            styleClass="w-100 #{property.strictValidation ? 'font-danger' : ''} validation-message">
            <ui:fragment rendered="#{!property.valid and !property.strictValidation}">
                <util:icon name="exclamation-triangle" class="warning-icon" />
            </ui:fragment>
            <ui:fragment rendered="#{!property.valid and property.strictValidation}">
                <util:icon name="exclamation-circle" class="warning-icon error" />
            </ui:fragment>
            <h:outputText value="#{property.validationErrorMessage}"/>
        </h:panelGroup>
        <!-- // VALIDATION MESSAGE -->

        <!-- HELP MESSAGE -->
        <intranda:formHelp content="#{property.helpMessage}" msgFor="input" />
        <!-- // HELP MESSAGE -->

    </composite:implementation>

</ui:composition>
